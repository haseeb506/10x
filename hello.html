<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome - Shruti</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 60px 40px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 600px;
    }
    .welcome-text {
      font-size: 3rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }
    .name {
      font-size: 2.5rem;
      color: #667eea;
      font-weight: 900;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .subtitle {
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .button {
      display: inline-block;
      padding: 15px 35px;
      margin: 10px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      transition: background 0.3s ease;
      border: none;
      cursor: pointer;
    }
    .button:hover {
      background: #764ba2;
    }
    .footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="welcome-text">Welcome</div>
    <div class="name">Shruti</div>
    <div class="subtitle">
      <p>Hello Shruti! Welcome to your personal homepage.</p>
      <p>This is your space to explore and create amazing web experiences.</p>
    </div>
    <button class="button" onclick="alert('Thanks for visiting!')">Say Hello</button>
    <a href="myname.html" class="button">Explore Tourist Places</a>
    <div class="footer">
      <p>&copy; 2026 | Created with care for you</p>
    </div>
  </div>
</body>
</html>
